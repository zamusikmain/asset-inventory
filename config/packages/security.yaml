security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    role_hierarchy:
        ROLE_ADMIN: [ROLE_IT, ROLE_INVENTORY_INITIATOR, ROLE_COMMISSION]
        ROLE_IT: [ROLE_USER]
        ROLE_INVENTORY_INITIATOR: [ROLE_USER]
        ROLE_COMMISSION: [ROLE_USER]

    firewalls:
        dev:
            # без "assets/": /assets/* — маршруты реестра оборудования
            pattern: ^/(_profiler(/|$)|_wdt/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_login
            # Дополнительно к счетчику в User — ограничение частоты попыток по IP
            login_throttling:
                max_attempts: 10
                interval: '15 minutes'

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/(manifest\.webmanifest|sw\.js|offline)$, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        # подписание акта сотрудником по ссылке с HMAC-токеном
        - { path: ^/sign/, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
