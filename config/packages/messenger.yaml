framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine Transport на старте (п. 3 ТЗ)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 60000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            App\Message\SendNotification: async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
