name: asset-inventory

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-assets}?serverVersion=16&charset=utf8"
    volumes:
      - ./:/var/www/app
      - vendor:/var/www/app/vendor
      - var:/var/www/app/var
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-assets}?serverVersion=16&charset=utf8"
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    volumes:
      - ./:/var/www/app
      - vendor:/var/www/app/vendor
      - var:/var/www/app/var
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assets}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-assets}"]
      interval: 5s
      retries: 20

  # DEV: перехват писем вместо корпоративного SMTP (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.231.10.0/24}

volumes:
  pgdata:
  storage:
  vendor:
  var:
